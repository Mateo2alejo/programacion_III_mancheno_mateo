<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formato de texto</title>
</head>
<body>
    <h1>Formato de texto</h1>
    <p><b>AVENGERS</b></p>
    <p><strong>Texto en negrita</strong></p>
    <p><em>Texto en cursiva</em></p>
    <p><u>Texto subrayado</u></p>
    <p><del>Texto tachado</del></p>
    <p><mark>Texto resaltado</mark></p>
    <P><del>Texto en mayusculas</del></P>
    <p><big>Texto en tamaño grande</big> </p>
    <p><ins>Texto insertado</ins></p> 
    
    
</body>
</html>
