<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estadísticas de Fútbol</title>
</head>

<body>
    <h1>Registro de Jugadores y Estadísticas de Partido</h1>

    <form action="/registro-transporte" method="post">
        <table>
            <tr>
                <td>
                    <label for="nombre_conductor">Nombre del Jugador</label><br>
                    <input type="text" id="nombre_conductor" name="nombre_conductor" placeholder="Ej. Kendry">
                </td>
                <td>
                    <label for="apellido_conductor">Apellido del Jugador</label><br>
                    <input type="text" id="apellido_conductor" name="apellido_conductor" placeholder="Ej. Páez">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="cedula">Número de Dorsal / Camiseta</label><br>
                    <input type="text" id="cedula" name="cedula" placeholder="10">
                </td>
                <td>
                    <label for="licencia">Posición en el Campo</label><br>
                    <select id="licencia" name="licencia" required>
                        <option value="">Selecciona una opción</option>
                        <option value="tipo_c">Delantero / Extremo</option>
                        <option value="tipo_d">Mediocampista / Volante</option>
                        <option value="tipo_e">Defensa / Arquero</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="experiencia">Partidos Jugados en Temporada</label><br>
                    <input 
                        type="number" 
                        id="experiencia" 
                        name="experiencia" 
                        min="1" 
                        max="40" 
                        value="5"
                    >
                </td>
                <td>
                    <label for="capacidad_bus">Minutos Disputados</label><br>
                    <input 
                        type="number" 
                        id="capacidad_bus" 
                        name="capacidad_bus" 
                        min="20" 
                        max="200" 
                        value="80" 
                        step="10"
                    >
                </td>
            </tr>
            <tr>
                <td>
                    <p>Condición de partido:</p>
                    <input type="radio" id="urbano" name="modalidad" value="urbano">
                    <label for="urbano">Local</label>

                    <input type="radio" id="brt" name="modalidad" value="brt">
                    <label for="brt">Visitante</label>

                    <input type="radio" id="alimentador" name="modalidad" value="alimentador">
                    <label for="alimentador">Cancha Neutral</label>
                </td>
                <td>
                    <p>Estadísticas registradas:</p>
                    <input 
                        type="checkbox" 
                        id="gps" 
                        name="seguridad" 
                        value="gps"
                    >
                    <label for="gps">Gol anotado</label><br>

                    <input 
                        type="checkbox" 
                        id="camaras" 
                        name="seguridad" 
                        value="camaras"
                    >
                    <label for="camaras">Asistencia</label><br>

                    <input 
                        type="checkbox" 
                        id="pago_electronico" 
                        name="seguridad" 
                        value="pago_electronico"
                    >
                    <label for="pago_electronico">Tarjeta amarilla</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="ruta_asignada">Competición / Torneo</label><br>
                    <select id="ruta_asignada" name="ruta_asignada" required>
                        <option value="">Selecciona un Torneo</option>
                        <option value="ruta_1">LigaPro Serie A</option>
                        <option value="ruta_2">Copa Libertadores</option>
                        <option value="ruta_3">Eliminatorias Sudamericanas</option>
                    </select>
                </td>
                <td>
                    <label for="turnos">Franjas de Tiempo Analizadas (puedes seleccionar varias)</label><br>
                    <select id="turnos" name="turnos" multiple size="3">
                        <option value="matutino">Primer Tiempo (0' - 45')</option>
                        <option value="vespertino">Segundo Tiempo (46' - 90')</option>
                        <option value="nocturno">Tiempo Adicional / Prórroga</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <fieldset>
                        <legend>Datos Estadísticos del Encuentro</legend>
                        <label for="placa">Código de Partido / Marcador</label><br>
                        <input type="text" id="placa" name="placa" placeholder="J12-LOC2-VIS1"><br><br>
                        
                        <label for="anio_unidad">Temporada / Año</label><br>
                        <input type="number" id="anio_unidad" name="anio_unidad" min="2000" max="2026" value="2026">
                    </fieldset>
                </td>
            </tr>
        </table>

        <br>
        <button type="submit">Registrar Estadística</button>
        <button type="reset">Limpiar Formulario</button>
    </form>
</body>

</html>
