<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia - Estadísticas de Fútbol</title>
</head>
<body>
    <header>
        <h1>Centro Multimedia de Estadísticas de Fútbol</h1>
    </header>

    <main>
        <section>
            <h2>Ambiente de Estadio y Relato (Audio)</h2>
            <audio id="audio_unidad" src="music_mp_mancheno_mateo/ambiente_estadio.mp3" controls loop>
                Tu navegador no soporta el elemento de audio HTML5.
            </audio>
        </section>

        <section>
            <h2>Análisis de Jugadas y Resumen (Video)</h2>
            <video src="videos_mp_mancheno_mateo/resumen_partido_01.mp4" controls width="500">
                Tu navegador no soporta el elemento de video HTML5.
            </video>
        </section>

        <section>
            <h1>Seguimiento de Competiciones</h1>
            <h2>Plataformas y Registro de Estadísticas</h2>
            
            <iframe src="https://www.transfermarkt.es/"
                    width="600" 
                    height="350" 
                    title="Estadísticas y datos de fútbol en línea" 
                    loading="lazy">
            </iframe>

            <br><br>

            <iframe src="11_formulario_futbol_mp_mancheno_mateo.html"
                    width="600" 
                    height="350" 
                    title="Formulario de Registro de Estadísticas de Fútbol" 
                    loading="lazy">
            </iframe>
        </section>
    </main>
</body>
</html>
