<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores - Estadísticas de Fútbol</title>
    <link rel="stylesheet" href="03_colores_mp_mateo_mancheno.css">
    <style>
        body {
            background-color: rgb(250, 198, 255);
        }
        h1 {
            color: rgb(255, 132, 218);
        }
        h2 {
            color: rgb(15, 15, 15);
        }
        h3 {
            color: #ff0000;
        }
        h4 {
            color: rgba(255, 0, 0, 1);
        }
        h5 {
            color: hsla(0, 100%, 50%, 1);
        }
    </style>
</head>
<body>
    <h1>Maneras de establecer colores - Estadísticas de Fútbol</h1>
    <h2>Por nombre del color: Goles y asistencias</h2>
    <h3>RGB: Posesión de balón y pases</h3>
    <h4>RGBA: Tiros al arco y xG</h4>
    <h5>HSL: Tarjetas, faltas y rachas</h5>
</body>
</html>
